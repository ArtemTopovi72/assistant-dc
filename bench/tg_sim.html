<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TG Sim</title>
<style>
:root{--bg:#0e1621;--panel:#17212b;--in:#182533;--out:#2b5278;--txt:#e6edf3;--mut:#7f91a4;--acc:#5eb5f7;--btn:#223445}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--panel);padding:10px 16px;display:flex;gap:12px;align-items:center}
header b{flex:1}header input{width:110px;background:var(--bg);color:var(--txt);border:1px solid #2a3a4a;border-radius:6px;padding:4px 8px}
#busy{color:var(--acc);font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(560px,85%);padding:7px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--in);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--out);align-self:flex-end;border-bottom-right-radius:4px}
.q{border-left:3px solid var(--acc);padding:2px 8px;margin-bottom:4px;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw{font-size:12px;color:var(--acc);margin-bottom:2px}
.m.hl{outline:2px solid var(--acc)}
#rb{display:none;background:var(--panel);padding:6px 12px;font-size:13px;color:var(--mut)}#rb b{color:var(--acc)}#rb span{float:right;cursor:pointer}
.m img,.m video{max-width:100%;border-radius:8px;display:block;margin-bottom:4px}
.m audio{width:100%}
.meta{font-size:11px;color:var(--mut);text-align:right}
.ik{display:grid;gap:4px;margin-top:6px}.ik div{display:flex;gap:4px}
.ik button,.kb button{flex:1;background:var(--btn);color:var(--txt);border:0;border-radius:6px;padding:6px;cursor:pointer;font:inherit;font-size:13px}
.ik button:hover,.kb button:hover{background:#2e4458}
.kb{background:var(--panel);padding:6px;display:grid;gap:4px}.kb div{display:flex;gap:4px}
form{display:flex;gap:8px;background:var(--panel);padding:10px}
textarea{flex:1;resize:none;background:var(--bg);color:var(--txt);border:0;border-radius:8px;padding:8px;font:inherit;height:42px}
form button,label.f{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:0 14px;cursor:pointer;display:flex;align-items:center}
label.f{background:var(--btn)}
a{color:var(--acc)}
</style></head><body>
<header><b>🤖 Бот (симулятор)</b><span id="busy"></span>переслать от <input id="fwd" placeholder="имя"> chat <input id="cid" value="386000001"></header>
<div id="log"></div>
<div id="rb">↩ ответ на <b></b><span>✖</span></div>
<div class="kb" id="kb"></div>
<form id="f">
<label class="f" title="фото/голос/файл">📎<input type="file" id="file" multiple hidden></label>
<textarea id="t" placeholder="Сообщение… (Enter — отправить, двойной клик по сообщению — ответить)"></textarea><button>➤</button></form>
<script>
const $=s=>document.querySelector(s);let since=0,cid=$('#cid').value;const byId={};
let replyTo=0;
function extra(){const o={};if(replyTo)o.reply_to=replyTo;const f=$('#fwd').value.trim();if(f)o.forward_from=f;replyTo=0;$('#rb').style.display='none';return o}
const api=(p,b)=>fetch(p,{method:'POST',body:JSON.stringify(Object.assign({chat:cid},b))});
function snippet(id){const d=byId[id];return d?((d.querySelector('.tx')||d).textContent.slice(0,80)||'🖼'):'#'+id}
function quote(id){return id?`<div class="q" onclick="jump(${id})">${esc(snippet(id))}</div>`:''}
function jump(id){const d=byId[id];if(!d)return;d.scrollIntoView({block:'center'});d.classList.add('hl');setTimeout(()=>d.classList.remove('hl'),1200)}
function pick(id){replyTo=id;$('#rb b').textContent=snippet(id);$('#rb').style.display='block';$('#t').focus()}
$('#rb span').onclick=()=>{replyTo=0;$('#rb').style.display='none'};
function rid(p){let r=p.reply_parameters;if(typeof r==='string')try{r=JSON.parse(r)}catch(_){r=null}return r?r.message_id:0}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c])}
function html(s,mode){return mode==='HTML'?s:esc(s)}
function mine(text){const d=document.createElement('div');d.className='m me';d.textContent=text;add(d)}
function add(d){const l=$('#log');const end=l.scrollHeight-l.scrollTop-l.clientHeight<80;l.appendChild(d);if(end)l.scrollTop=l.scrollHeight}
function ikb(rm,mid){if(!rm||!rm.inline_keyboard)return'';const w=document.createElement('div');w.className='ik';
 rm.inline_keyboard.forEach(r=>{const row=document.createElement('div');r.forEach(b=>{const x=document.createElement('button');x.textContent=b.text;
  x.onclick=()=>{if(b.url)return window.open(b.url);mine('⟶ '+b.text);api('/press',{data:b.callback_data,message_id:mid})};row.appendChild(x)});w.appendChild(row)});return w}
function replyKb(rm){if(!rm)return;if(rm.remove_keyboard){$('#kb').innerHTML='';return}if(!rm.keyboard)return;const k=$('#kb');k.innerHTML='';
 rm.keyboard.forEach(r=>{const row=document.createElement('div');r.forEach(b=>{const x=document.createElement('button');const t=b.text||b;x.textContent=t;x.onclick=()=>send(t);row.appendChild(x)});k.appendChild(row)})}
function media(e){const d=(e.payload||{}).document;if(!e.file&&typeof d==='string'&&d.startsWith('file:///'))e.file=decodeURIComponent(d.slice(8));if(!e.file)return'';const u='/file?p='+encodeURIComponent(e.file);
 if(e.method==='sendPhoto')return`<img src="${u}">`;if(e.method==='sendVideo'||e.method==='sendAnimation')return`<video src="${u}" controls></video>`;
 if(e.method==='sendVoice'||e.method==='sendAudio')return`<audio src="${u}" controls></audio>`;return`<a href="${u}" target=_blank>📄 ${esc(e.file.split(/[\\/]/).pop())}</a><br>`}
function render(e){const p=e.payload||{};if(typeof p.reply_markup==='string')try{p.reply_markup=JSON.parse(p.reply_markup)}catch(_){}
 if(e.method==='deleteMessage'){const d=byId[p.message_id];if(d)d.remove();return}
 if(e.method==='user'){const d=document.createElement('div');d.className='m me';byId[e.message_id]=d;
  const old=p.date<Date.now()/1000-300?' · '+new Date(p.date*1000).toLocaleString():'';
  d.innerHTML=(p.forward_from?`<div class="fw">Переслано от ${esc(p.forward_from.first_name)}</div>`:'')+quote((p.reply_to_message||{}).message_id)+`<div class="tx">${esc((p.photo?'🖼 ':'')+(p.text||p.caption||(p.photo?'':'[медиа]')))}</div><div class="meta">#${e.message_id}${old}</div>`;
  d.ondblclick=()=>pick(e.message_id);add(d);return}
 if(e.method==='editMessageText'||e.method==='editMessageCaption'){const d=byId[p.message_id];if(d){d.querySelector('.tx').innerHTML=html(p.text||p.caption||'',p.parse_mode);const k=d.querySelector('.ik');if(k)k.remove();const n=ikb(p.reply_markup,p.message_id);if(n)d.appendChild(n)}return}
 if(!/^send/.test(e.method))return;
 const d=document.createElement('div');d.className='m bot';byId[e.message_id]=d;
 d.ondblclick=()=>pick(e.message_id);d.innerHTML=quote(rid(p))+media(e)+`<div class="tx">${html(p.text||p.caption||'',p.parse_mode)}</div><div class="meta">${e.method.replace('send','')} · ${new Date(e.t*1000).toLocaleTimeString()}</div>`;
 const k=ikb(p.reply_markup,e.message_id);if(k)d.appendChild(k);replyKb(p.reply_markup);add(d)}
async function poll(){try{const r=await (await fetch(`/events?chat=${cid}&since=${since}`)).json();r.events.forEach(render);since=r.n;$('#busy').textContent=r.busy?'печатает…':''}catch(e){}setTimeout(poll,700)}
function send(t){if(!t.trim())return;api('/say',Object.assign({text:t},extra()))}
$('#f').onsubmit=e=>{e.preventDefault();send($('#t').value);$('#t').value=''};
$('#t').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit()}};
$('#cid').onchange=()=>{cid=$('#cid').value;since=0;$('#log').innerHTML='';$('#kb').innerHTML=''};
const b64of=async f=>btoa(new Uint8Array(await f.arrayBuffer()).reduce((a,c)=>a+String.fromCharCode(c),''));
$('#file').onchange=async()=>{const fs=[...$('#file').files];if(!fs.length)return;const cap=$('#t').value;$('#t').value='';const x=extra();
 if(fs.length>1&&fs.every(f=>/^image/.test(f.type))){const files=[];for(const f of fs)files.push({name:f.name,b64:await b64of(f)});api('/album',Object.assign({files,caption:cap},x))}
 else{const f=fs[0];const kind=/^image/.test(f.type)?'photo':/ogg|opus/.test(f.type)?'voice':'document';api('/upload',Object.assign({kind,name:f.name,b64:await b64of(f),caption:cap},x))}
 $('#file').value=''};
poll();
</script></body></html>
